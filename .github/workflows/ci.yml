name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check datadog_checks tests
      - name: Type check
        run: mypy datadog_checks/uwsgi_stats
      - name: Test
        run: pytest -v

  py38-compat:
    # The check runs in the Agent's embedded Python; verify the runtime source
    # is import/syntax compatible with 3.8 even though the test toolchain needs >=3.10.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Byte-compile runtime under 3.8
        run: python -m compileall datadog_checks
