[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# NOTE: the distribution name deliberately has NO "datadog-" prefix, even though
# this IS a datadog_checks integration. The Agent's upgrade restore
# (omnibus/python-scripts/packages.py) routes a package by name alone:
#   startswith("datadog-") and not in DEPS_STARTING_WITH_DATADOG
#     -> `datadog-agent integration install -t` -> Datadog's TUF repo -> 404 for us
#   otherwise
#     -> embedded pip -> PyPI -> works
# A "datadog-"-prefixed name therefore makes every Agent `apt upgrade` fail in
# postinst. See ADR 0004. The Agent derives the check name by stripping that
# prefix and mapping "-"->"_", so "uwsgi-stats" still yields check `uwsgi_stats`
# and conf.d/uwsgi_stats.d, exactly as the old name did.
name = "uwsgi-stats"
dynamic = ["version"]
description = "Datadog Agent check for the uWSGI stats server"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christophe Pettus", email = "cpettus@pgexperts.com" }]
dependencies = ["datadog-checks-base"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/Xof/monitor_uwsgi"
Source = "https://github.com/Xof/monitor_uwsgi"
Issues = "https://github.com/Xof/monitor_uwsgi/issues"

[project.optional-dependencies]
dev = ["datadog-checks-base[deps]", "datadog-checks-dev", "pytest", "ruff", "mypy"]

[tool.setuptools.dynamic]
version = { attr = "datadog_checks.uwsgi_stats.__about__.__version__" }

[tool.setuptools.packages.find]
include = ["datadog_checks*"]
namespaces = true

[tool.setuptools.package-data]
"datadog_checks.uwsgi_stats" = ["data/*"]

# ddtrace ships its own pytest11 plugins (activated just by being installed, since it's
# a transitive dep of datadog-checks-base[deps]). Its CI Visibility hooks probe the
# network at collection time and hang for minutes in sandboxes/CI runners with no
# egress, rather than failing fast. We don't want APM tracing of our own test suite,
# so disable those three plugins unconditionally.
[tool.pytest.ini_options]
addopts = "-p no:ddtrace -p no:ddtrace.pytest_bdd -p no:ddtrace.pytest_benchmark"

[tool.ruff]
line-length = 120
target-version = "py38"

# Pin the rule selection explicitly. Ruff's *default* selection is not stable
# across releases: `ruff` is unpinned in the dev extra, and 0.16 widened the
# default set to include I (isort) and UP (pyupgrade), turning CI red on code
# that had not been touched in over a month. Selecting explicitly means a ruff
# upgrade can still improve these rules but cannot silently add new families.
# This is the set that was in effect through 1.0.0; widening it is a deliberate
# change, made on its own, not a side effect of a toolchain bump.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
